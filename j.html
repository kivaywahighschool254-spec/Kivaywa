    <style>
        /* ——— global reset & base ——— */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f6f9fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 16px;
        }

        /* main card – glassmorphism with subtle depth */
        .loader-wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 48px;
            padding: 48px 32px 40px;
            box-shadow: 
                0 20px 40px -12px rgba(0, 20, 30, 0.15),
                0 4px 18px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.25s ease;
            text-align: center;
        }

        /* ——— brand header ——— */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand i {
            font-size: 2.6rem;
            color: #1e3a5f;
            background: linear-gradient(145deg, #1e3a5f, #2b5a8a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(27, 55, 96, 0.15));
        }

        .brand h1 {
            font-weight: 700;
            font-size: 2.4rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #1a2f4f, #2b5a8a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.1;
        }

        .brand span {
            font-weight: 300;
            color: #3e5f7e;
            -webkit-text-fill-color: #3e5f7e;
            background: none;
        }

        /* tagline */
        .tagline {
            font-weight: 400;
            font-size: 0.95rem;
            color: #2f4a6b;
            opacity: 0.8;
            letter-spacing: 0.3px;
            margin-top: -6px;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(60, 100, 140, 0.08);
            padding-bottom: 12px;
            display: inline-block;
        }

        /* ——— loader animation ——— */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            margin: 18px 0 12px;
        }

        /* elegant spinner – 3 dots with smooth scale & glow */
        .spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1e3a5f;
            opacity: 0.3;
            transform: scale(0.7);
            animation: dotPulse 1.8s infinite ease-in-out;
            box-shadow: 0 0 0 0 rgba(30, 58, 95, 0);
        }

        .dot:nth-child(1) { animation-delay: 0s; background: #1e3a5f; }
        .dot:nth-child(2) { animation-delay: 0.3s; background: #2b5a8a; }
        .dot:nth-child(3) { animation-delay: 0.6s; background: #4a7aaa; }

        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0.7);
                opacity: 0.3;
                box-shadow: 0 0 0 0 rgba(30, 58, 95, 0);
            }
            40% {
                transform: scale(1.1);
                opacity: 1;
                box-shadow: 0 0 18px 6px rgba(30, 58, 95, 0.12);
            }
        }

        /* progress bar – subtle, modern */
        .progress-track {
            width: 100%;
            max-width: 280px;
            height: 4px;
            background: rgba(30, 58, 95, 0.12);
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #1e3a5f, #4a7aaa, #1e3a5f);
            background-size: 200% 100%;
            border-radius: 8px;
            transition: width 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            animation: shimmer 2.4s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        /* percentage + subtle message */
        .status-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }

        .percentage {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #1a2f4f;
            background: rgba(30, 58, 95, 0.03);
            padding: 4px 18px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(30, 58, 95, 0.04);
        }

        .loading-text {
            font-weight: 400;
            font-size: 0.9rem;
            color: #2f4a6b;
            opacity: 0.7;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-text i {
            font-size: 0.8rem;
            opacity: 0.5;
        }

        /* footer / credits – minimal */
        .loader-footer {
            margin-top: 32px;
            color: #4b6a89;
            font-size: 0.75rem;
            letter-spacing: 0.2px;
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid rgba(60, 100, 140, 0.06);
            padding-top: 20px;
        }

        .loader-footer i {
            font-size: 0.7rem;
        }

        /* ——— responsive fine-tune ——— */
        @media (max-width: 480px) {
            .loader-wrapper {
                padding: 32px 20px 28px;
                border-radius: 36px;
            }
            .brand h1 {
                font-size: 2rem;
            }
            .brand i {
                font-size: 2.2rem;
            }
            .dot {
                width: 15px;
                height: 15px;
                gap: 12px;
            }
            .progress-track {
                max-width: 200px;
            }
            .percentage {
                font-size: 1rem;
                padding: 2px 14px;
            }
        }

        @media (max-width: 380px) {
            .brand h1 {
                font-size: 1.7rem;
            }
            .loader-wrapper {
                padding: 24px 16px;
            }
        }

        /* tall screens / landscape */
        @media (max-height: 700px) {
            .loader-wrapper {
                padding: 28px 24px 24px;
            }
            .brand {
                margin-bottom: 8px;
            }
            .tagline {
                margin-bottom: 16px;
                padding-bottom: 6px;
            }
            .loader-container {
                gap: 16px;
            }
            .loader-footer {
                margin-top: 16px;
                padding-top: 12px;
            }
        }

        /* extra polish: dark mode friendly (optional) */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0e1a26;
            }
            .loader-wrapper {
                background: rgba(22, 34, 48, 0.7);
                backdrop-filter: blur(14px) saturate(180%);
                -webkit-backdrop-filter: blur(14px) saturate(180%);
                border-color: rgba(255, 255, 255, 0.08);
                box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
            }
            .brand h1 {
                background: linear-gradient(135deg, #b6d4f0, #82b0e0);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .brand i {
                background: linear-gradient(145deg, #b6d4f0, #82b0e0);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .brand span {
                -webkit-text-fill-color: #aac3dd;
                color: #aac3dd;
            }
            .tagline {
                color: #b0cade;
                border-bottom-color: rgba(120, 170, 210, 0.12);
            }
            .dot {
                background: #b6d4f0 !important;
                box-shadow: 0 0 12px rgba(120, 180, 240, 0.2);
            }
            .dot:nth-child(2) { background: #82b0e0 !important; }
            .dot:nth-child(3) { background: #5f8fc0 !important; }
            .percentage {
                color: #d6e6f9;
                background: rgba(255, 255, 255, 0.02);
                border-color: rgba(255, 255, 255, 0.04);
            }
            .loading-text {
                color: #b0cade;
            }
            .progress-track {
                background: rgba(255, 255, 255, 0.08);
            }
            .progress-fill {
                background: linear-gradient(90deg, #82b0e0, #b6d4f0, #82b0e0);
                background-size: 200% 100%;
            }
            .loader-footer {
                color: #8dabca;
                border-top-color: rgba(255, 255, 255, 0.04);
            }
            @keyframes dotPulse {
                0%, 80%, 100% {
                    transform: scale(0.7);
                    opacity: 0.3;
                    box-shadow: 0 0 0 0 rgba(130, 176, 224, 0);
                }
                40% {
                    transform: scale(1.1);
                    opacity: 1;
                    box-shadow: 0 0 24px 8px rgba(130, 176, 224, 0.2);
                }
            }
        }
    </style>
</head>
<body>

    <div class="loader-wrapper" role="main" aria-label="EduTrust loading screen">
        <!-- Brand -->
        <div class="brand">
            <i class="fas fa-graduation-cap" aria-hidden="true"></i>
            <h1>Edu<span>Trust</span></h1>
        </div>
        <div class="tagline">
            <i class="fas fa-shield-alt" style="margin-right: 6px; opacity: 0.5;"></i> secure · connected · inspired
        </div>

        <!-- loader core -->
        <div class="loader-container">
            <!-- animated dots -->
            <div class="spinner" aria-hidden="true">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <!-- progress -->
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>

            <!-- status -->
            <div class="status-message">
                <div class="percentage" id="percentageDisplay">0%</div>
                <div class="loading-text">
                    <i class="fas fa-circle-notch fa-fw fa-spin" style="opacity: 0.6;"></i>
                    <span id="statusText">preparing your experience</span>
                </div>
            </div>
        </div>

        <!-- footer (elegant) -->
        <div class="loader-footer">
            <i class="fas fa-lock" style="opacity: 0.3;"></i> 
            <span>EduTrust · loading</span>
            <i class="fas fa-circle" style="font-size: 0.25rem; opacity: 0.2;"></i>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // DOM elements
            const progressFill = document.getElementById('progressFill');
            const percentageDisplay = document.getElementById('percentageDisplay');
            const statusText = document.getElementById('statusText');

            // status messages – elegant & varied
            const statusMessages = [
                'preparing your experience',
                'connecting to secure servers',
                'verifying credentials',
                'syncing your network',
                'loading personalized feed',
                'almost there',
                'welcome back'
            ];

            let progress = 0;
            let interval = null;
            let msgIndex = 0;

            // Update UI with current progress
            function updateProgress(value) {
                const clamped = Math.min(100, Math.max(0, value));
                progress = clamped;

                // update progress bar width
                progressFill.style.width = clamped + '%';

                // update percentage text
                percentageDisplay.textContent = Math.round(clamped) + '%';

                // update status message every ~15% 
                const step = Math.floor(clamped / 15);
                if (step < statusMessages.length && step !== msgIndex) {
                    msgIndex = step;
                    statusText.textContent = statusMessages[step] || statusMessages[statusMessages.length - 1];
                }

                // when complete – redirect to login page in Frontend folder
                if (clamped >= 100) {
                    clearInterval(interval);
                    interval = null;
                    statusText.textContent = '✨ ready!';
                    // slight delay before redirect (smooth)
                    setTimeout(() => {
                        window.location.href = 'Frontend/login.html';
                    }, 500);
                }
            }

            // start loading – incremental with natural feel
            function startLoading() {
                if (interval) return;

                let lastTimestamp = performance.now();

                interval = setInterval(() => {
                    const now = performance.now();
                    const delta = (now - lastTimestamp) / 1000; // seconds
                    lastTimestamp = now;

                    // dynamic increment: fast at start, slow near end (ease-out)
                    let increment = 0;
                    if (progress < 30) {
                        increment = 1.2 + delta * 2.8;   // quick start
                    } else if (progress < 70) {
                        increment = 0.9 + delta * 1.6;   // steady
                    } else {
                        increment = 0.3 + delta * 0.5;   // slow down to 100
                    }

                    // add some natural jitter (small random)
                    const jitter = (Math.random() * 0.6) - 0.2;
                    let next = progress + increment + jitter;

                    // cap at 100
                    if (next >= 100) {
                        updateProgress(100);
                        return;
                    }

                    // ensure it never goes backwards
                    if (next > progress) {
                        updateProgress(next);
                    }

                    // safety: if progress hasn't moved in a while, force a bump
                    if (progress < 30 && performance.now() - lastTimestamp > 1800) {
                        updateProgress(progress + 1.8);
                    }

                }, 120); // smooth 120ms interval
            }

            // —— start the loading sequence ——
            // initial progress from 0
            updateProgress(0);

            // set first status message
            statusText.textContent = statusMessages[0];

            // start after a tiny delay (for visual settle)
            setTimeout(() => {
                startLoading();
            }, 300);

            // fallback: if something goes wrong, redirect after 12s (safe)
            const safetyTimer = setTimeout(() => {
                if (progress < 100) {
                    // force complete
                    updateProgress(100);
                }
            }, 12000);

            // clean up if page unloads (optional)
            window.addEventListener('beforeunload', function() {
                if (interval) clearInterval(interval);
                clearTimeout(safetyTimer);
            });

            console.log('EduTrust loading screen · redirecting to Frontend/login.html');
        })();
    </script>
</body>
</html>
