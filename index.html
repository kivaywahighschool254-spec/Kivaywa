<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102923">
  <title>Loading | Kivaywa</title>
  <style>
    :root {
      color-scheme: dark;
      --forest: #102923;
      --forest-light: #193c32;
      --cream: #f3f0df;
      --muted: #a8b7a8;
      --lime: #d6f36a;
      --coral: #ff8b70;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--cream);
      background-color: var(--forest);
      background-image:
        linear-gradient(rgba(243, 240, 223, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243, 240, 223, .035) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 42%, var(--forest-light), var(--forest) 68%);
      background-size: 48px 48px, 48px 48px, auto;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .loader {
      width: min(100% - 48px, 520px);
      padding: 32px 0;
      animation: arrive .8s ease-out both;
    }

    .topline, .status-row, .bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topline { padding-bottom: 22px; border-bottom: 1px solid rgba(243, 240, 223, .2); }

    .wordmark {
      color: var(--cream);
      font: 700 13px/1.2 'Courier New', monospace;
      letter-spacing: .14em;
    }

    .wordmark span { color: var(--lime); }

    .edition, .eyebrow, .status, .percent, .bottomline {
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }

    .edition { color: var(--muted); font-size: 10px; letter-spacing: .12em; }

    .visual {
      position: relative;
      width: 148px;
      height: 148px;
      margin: 68px auto 42px;
      display: grid;
      place-items: center;
    }


    .eyebrow {
      margin: 0 0 14px;
      color: var(--lime);
      font-size: 10px;
      letter-spacing: .18em;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 54px);
      font-weight: 400;
      line-height: 1.05;
      text-align: center;
    }

    h1 em { color: var(--lime); font-weight: 400; }

    .description {
      margin: 15px 0 34px;
      color: var(--muted);
      font: 13px/1.6 'Courier New', monospace;
      text-align: center;
    }

    .status-row { margin-bottom: 10px; }
    .status, .percent { color: var(--cream); font-size: 10px; letter-spacing: .08em; }
    .percent { color: var(--lime); }

    .track {
      height: 3px;
      overflow: hidden;
      background: rgba(243, 240, 223, .18);
    }

    .track::after {
      content: '';
      display: block;
      width: 34%;
      height: 100%;
      background: var(--lime);
      animation: progress 1.8s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .bottomline {
      margin-top: 18px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .1em;
    }

    .signal { color: var(--coral); }

    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes pulse {
      50% { transform: translate(-50%, -50%) scale(.88); opacity: .65; }
    }
    @keyframes progress {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(300%); }
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .visual { margin-top: 54px; margin-bottom: 34px; }
      .loader { width: min(100% - 40px, 520px); }
      .edition { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="loader" aria-labelledby="loading-title" aria-busy="true">
    <header class="topline">
      <div class="wordmark">KIVAYWA<span>.</span></div>
      <div class="edition">KNOWLEDGE IS IMMORTAL</div>
    </header>

    <div>
      <image src= url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEXKg3F8mkTHc73zQo-a_wI7I_0e2TM3t3z8YZ0gQYYw&s=10)></image>
      
    </div>

    <p class="eyebrow">A little moment</p>
    <h1 id="loading-title">Good things<br>are <em>gathering.</em></h1>
    <p class="description">Getting everything ready for you.</p>

    <section aria-label="Loading status">
      <div class="status-row">
        <span class="status" role="status">Knowledge is being made immortal</span>
        <span class="percent" aria-hidden="true">•••</span>
      </div>
      <div class="track" aria-hidden="true"></div>
    </section>

    <footer class="bottomline">
      <span>One moment, please</span>
      <span class="signal">● &nbsp;SYSTEM ONLINE</span>
    </footer>
  </main>
</body>
</html>
