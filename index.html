<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends Kivaywa Boys Senior School</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .loader-container {
      text-align: center;
    }

    .loader {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      font-size: 20px;
      letter-spacing: 2px;
    }

    .dots::after {
      content: "";
      animation: dots 1.5s infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dots {
      0% {
        content: "";
      }
      33% {
        content: ".";
      }
      66% {
        content: "..";
      }
      100% {
        content: "...";
      }
    }
  </style>
</head>

<body>

  <div class="loader-container">
    <div class="loader"></div>
    <div class="loading-text">
      Loading<span class="dots"></span>
    </div>
  </div>

  <script>
    // Optional: simulate loading for 3 seconds
    setTimeout(() => {
      console.log("Loading complete!");
    }, 3000);
  </script>

</body>
</html>
